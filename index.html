<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberWatch Sentinel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a1520;
    font-family: 'Courier New', monospace;
    color: #f0f6ff;
    overflow-x: hidden;
  }
  #grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  #app { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 24px 20px 120px; }

  /* Header */
  #header { border-bottom: 2px solid #00ccff; padding-bottom: 20px; margin-bottom: 28px; }
  #header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  #header-label { font-size: 11px; letter-spacing: 5px; color: #00e5ff; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 30px rgba(0,220,255,0.9); }
  h1 span { color: #00e5ff; }
  #sync-info { font-size: 12px; color: #b0cfe0; margin-top: 6px; letter-spacing: 1px; }
  #source-pills { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .source-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px; font-size: 11px; letter-spacing: 1px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
  }
  .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: #b0cfe0; transition: all 0.3s; }
  .pill-name { font-weight: 700; }
  .pill-count { color: #b0cfe0; }

  /* Buttons */
  button { font-family: 'Courier New', monospace; cursor: pointer; transition: all 0.2s; }
  #refresh-btn {
    background: rgba(0,200,255,0.12); border: 2px solid #00ccff;
    color: #00e5ff; padding: 9px 18px; font-size: 12px; letter-spacing: 2px; font-weight: 700;
  }
  #refresh-btn:hover { background: rgba(0,200,255,0.25); }
  #refresh-btn:disabled { color: #6a8a9a; cursor: default; border-color: #2a4a5a; background: transparent; }

  /* Filter bar */
  #filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  #filter-label { font-size: 11px; letter-spacing: 2px; color: #b0cfe0; margin-right: 4px; font-weight: 700; }
  .filter-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.25);
    color: #c0d8e8; padding: 6px 13px; font-size: 10px; letter-spacing: 2px; font-weight: 600;
  }
  .filter-btn:hover { border-color: rgba(255,255,255,0.5); color: #ffffff; }
  .filter-btn.active-ALL    { background: rgba(0,200,255,0.2);   border: 2px solid #00ccff; color: #00e5ff;  font-weight:700; }
  .filter-btn.active-CRITICAL { background: rgba(255,60,60,0.2); border: 2px solid #ff4444; color: #ff7070; font-weight:700; }
  .filter-btn.active-HIGH   { background: rgba(255,130,0,0.2);   border: 2px solid #ff8800; color: #ffaa44; font-weight:700; }
  .filter-btn.active-MEDIUM { background: rgba(255,200,0,0.2);   border: 2px solid #ffcc00; color: #ffe066; font-weight:700; }
  .filter-btn.active-LOW    { background: rgba(0,220,120,0.15);  border: 2px solid #00dd88; color: #44ffaa; font-weight:700; }
  .filter-btn.active-INFO   { background: rgba(0,180,255,0.15);  border: 2px solid #00aaff; color: #55ccff; font-weight:700; }
  #selected-count { margin-left: auto; font-size: 11px; color: #00e5ff; letter-spacing: 1px; font-weight: 700; }

  /* Keyword search */
  #search-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  #keyword-input {
    flex: 1; background: #0f2030; border: 2px solid rgba(0,180,255,0.3);
    color: #f0f6ff; padding: 12px 16px; font-family: 'Courier New', monospace;
    font-size: 16px; letter-spacing: 1px; outline: none;
    transition: border-color 0.2s; -webkit-appearance: none;
    border-radius: 0; min-height: 48px;
  }
  #keyword-input:focus { border-color: #00ccff; box-shadow: 0 0 12px rgba(0,200,255,0.3); }
  #keyword-input::placeholder { color: #4a7a9a; }
  #search-clear {
    background: transparent; border: 2px solid rgba(255,255,255,0.2);
    color: #b0cfe0; padding: 12px 16px; font-size: 13px; letter-spacing: 2px;
    font-weight: 700; display: none; min-height: 48px; min-width: 70px;
    -webkit-appearance: none; border-radius: 0;
  }
  #search-clear:hover { border-color: #ff5555; color: #ff5555; }
  #search-match-count { font-size: 11px; color: #00e5ff; letter-spacing: 1px; white-space: nowrap; min-width: 80px; }
  .keyword-highlight { background: rgba(255,220,0,0.3); color: #ffe066; border-radius: 2px; padding: 0 2px; font-weight: 700; }

  /* Feed items */
  #feed { display: flex; flex-direction: column; gap: 10px; }
  .feed-item {
    background: #0f2030;
    border: 1px solid rgba(0,180,255,0.3);
    padding: 14px 16px; cursor: pointer;
    transition: all 0.15s; position: relative; overflow: hidden;
    animation: fadeIn 0.3s ease both;
  }
  .feed-item:hover { border-color: #00ccff; background: #152a3a; }
  .feed-item.selected-CRITICAL { background: rgba(180,30,30,0.25); border: 2px solid #ff4444; }
  .feed-item.selected-HIGH     { background: rgba(180,90,0,0.25);  border: 2px solid #ff8800; }
  .feed-item.selected-MEDIUM   { background: rgba(160,130,0,0.2);  border: 2px solid #ffcc00; }
  .feed-item.selected-LOW      { background: rgba(0,140,70,0.18);  border: 2px solid #00dd88; }
  .feed-item.selected-INFO     { background: rgba(0,120,200,0.18); border: 2px solid #00aaff; }
  .item-accent { display:none; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .feed-item.selected-CRITICAL .item-accent { display:block; background:#ff4444; box-shadow:0 0 10px #ff4444; }
  .feed-item.selected-HIGH     .item-accent { display:block; background:#ff8800; box-shadow:0 0 10px #ff8800; }
  .feed-item.selected-MEDIUM   .item-accent { display:block; background:#ffcc00; box-shadow:0 0 10px #ffcc00; }
  .feed-item.selected-LOW      .item-accent { display:block; background:#00dd88; box-shadow:0 0 10px #00dd88; }
  .feed-item.selected-INFO     .item-accent { display:block; background:#00aaff; box-shadow:0 0 10px #00aaff; }
  .item-inner { display:flex; align-items:flex-start; gap:12px; }
  .item-checkbox {
    flex-shrink:0; margin-top:3px; width:16px; height:16px;
    border: 2px solid #4a7a9a;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.03);
  }
  .item-checkbox .check-inner { display:none; width:8px; height:8px; }
  .feed-item.selected-CRITICAL .item-checkbox { border-color:#ff4444; } .feed-item.selected-CRITICAL .item-checkbox .check-inner { display:block; background:#ff4444; }
  .feed-item.selected-HIGH     .item-checkbox { border-color:#ff8800; } .feed-item.selected-HIGH     .item-checkbox .check-inner { display:block; background:#ff8800; }
  .feed-item.selected-MEDIUM   .item-checkbox { border-color:#ffcc00; } .feed-item.selected-MEDIUM   .item-checkbox .check-inner { display:block; background:#ffcc00; }
  .feed-item.selected-LOW      .item-checkbox { border-color:#00dd88; } .feed-item.selected-LOW      .item-checkbox .check-inner { display:block; background:#00dd88; }
  .feed-item.selected-INFO     .item-checkbox { border-color:#00aaff; } .feed-item.selected-INFO     .item-checkbox .check-inner { display:block; background:#00aaff; }
  .item-body { flex:1; min-width:0; }
  .item-meta { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .sev-badge { font-size:10px; padding:3px 8px; letter-spacing:1.5px; font-weight:800; }
  .sev-CRITICAL { background:rgba(255,60,60,0.3);  border:1px solid #ff4444; color:#ff8888; }
  .sev-HIGH     { background:rgba(255,130,0,0.3);  border:1px solid #ff8800; color:#ffbb55; }
  .sev-MEDIUM   { background:rgba(255,200,0,0.25); border:1px solid #ffcc00; color:#ffe066; }
  .sev-LOW      { background:rgba(0,220,120,0.18); border:1px solid #00dd88; color:#55ffaa; }
  .sev-INFO     { background:rgba(0,180,255,0.18); border:1px solid #00aaff; color:#55ccff; }
  .src-badge { font-size:10px; padding:3px 8px; letter-spacing:1px; font-weight:600; }
  .item-date { font-size:10px; color:#8ab8d0; letter-spacing:1px; }
  .item-title { font-size:14px; font-weight:700; color:#ffffff; line-height:1.45; margin-bottom:5px; }
  .item-desc { font-size:12px; color:#b0cfe0; line-height:1.6; }
  .item-link {
    flex-shrink:0; font-size:11px; color:#00aaff; letter-spacing:1px; font-weight:700;
    text-decoration:none; padding:5px 10px; border:2px solid rgba(0,170,255,0.4);
    font-family:'Courier New',monospace; white-space:nowrap;
  }
  .item-link:hover { color:#00e5ff; border-color:#00ccff; background:rgba(0,200,255,0.1); }
  #empty-msg { text-align:center; padding:60px; color:#b0cfe0; letter-spacing:3px; font-size:13px; }

  /* Bottom bar */
  #bottom-bar {
    position:fixed; bottom:0; left:0; right:0;
    background: #0a1520;
    border-top: 2px solid #00ccff;
    padding:16px 24px; z-index:100;
  }
  #bottom-inner { max-width:1100px; margin:0 auto; }
  #bottom-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  #status-text { flex:1; font-size:12px; color:#b0cfe0; letter-spacing:1px; }
  #clear-btn {
    background:transparent; border:2px solid rgba(255,255,255,0.3);
    color:#c0d8e8; padding:10px 18px; font-size:11px; letter-spacing:2px; font-weight:700; display:none;
  }
  #clear-btn:hover { border-color:#ffffff; color:#ffffff; }
  #send-btn {
    background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.3);
    color:#c0d8e8; padding:10px 24px; font-size:11px; letter-spacing:3px; font-weight:700;
  }
  #send-btn.active {
    background:rgba(0,200,255,0.2); border:2px solid #00ccff;
    color:#00e5ff; box-shadow:0 0 25px rgba(0,200,255,0.3);
  }
  #send-btn.active:hover { background:rgba(0,200,255,0.35); }
  #send-result { display:none; margin-top:10px; padding:10px 16px; font-size:12px; letter-spacing:2px; font-weight:700; }
  #send-result.success { display:block; background:rgba(0,220,120,0.2); border:2px solid #00dd88; color:#55ffaa; }
  #send-result.error   { display:block; background:rgba(255,60,60,0.2);  border:2px solid #ff4444; color:#ff8888; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:#0a1520; }
  ::-webkit-scrollbar-thumb { background:#2a5060; border-radius:2px; }
</style>
</head>
<body>

<div id="grid-bg"></div>

<div id="app">
  <div id="header">
    <div id="header-top">
      <div>
        <div id="header-label">◈ CLASSIFIED — THREAT INTELLIGENCE FEED</div>
        <h1>CYBERWATCH <span>SENTINEL</span></h1>
        <div id="sync-info">INITIALIZING... · FEEDS: 16 ACTIVE</div>
        <div id="next-refresh" style="font-size:11px;color:#4a7a9a;margin-top:3px;letter-spacing:1px;"></div>
      </div>
      <button id="refresh-btn" onclick="fetchAll()">⟳ REFRESH</button>
    </div>
    <div id="source-pills"></div>
  </div>

  <div id="filter-bar">
    <span id="filter-label">FILTER:</span>
    <button class="filter-btn active-ALL" data-filter="ALL" onclick="setFilter('ALL')">ALL <span class="fc">(0)</span></button>
    <button class="filter-btn" data-filter="CRITICAL" onclick="setFilter('CRITICAL')">CRITICAL <span class="fc">(0)</span></button>
    <button class="filter-btn" data-filter="HIGH" onclick="setFilter('HIGH')">HIGH <span class="fc">(0)</span></button>
    <button class="filter-btn" data-filter="MEDIUM" onclick="setFilter('MEDIUM')">MEDIUM <span class="fc">(0)</span></button>
    <button class="filter-btn" data-filter="LOW" onclick="setFilter('LOW')">LOW <span class="fc">(0)</span></button>
    <button class="filter-btn" data-filter="INFO" onclick="setFilter('INFO')">INFO <span class="fc">(0)</span></button>
    <span id="selected-count"></span>
  </div>

  <!-- Keyword search -->
  <div id="search-bar">
    <input id="keyword-input" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="&#128269; Search e.g. CVE-2025-*, ransom*, *malware*" />
    <button id="search-clear" onclick="clearSearch()">&#x2715; CLEAR</button>
    <span id="search-match-count"></span>
  </div>

  <div id="feed">
    <div id="empty-msg">◌ SCANNING THREAT FEEDS...</div>
  </div>
</div>

<div id="bottom-bar">
  <div id="bottom-inner">
    <div id="bottom-row">
      <div id="status-text">◇ CLICK ITEMS ABOVE TO SELECT FOR DIGEST</div>
      <button id="clear-btn" onclick="clearSelected()">CLEAR</button>
      <button id="send-btn" onclick="sendToTelegram()">✈ SEND TO TELEGRAM</button>
    </div>
    <div id="send-result"></div>
  </div>
</div>

<script>
const TELEGRAM_TOKEN = "8286354837:AAHhXHMeEpZksW14pRJlbsQvm_RkEys_gHU";
const TELEGRAM_CHAT_ID = "209881134";

const SOURCES = [
  { id:"cisa",       name:"CISA",    label:"CISA Alerts",          color:"#ff5555", url:"https://www.cisa.gov/cybersecurity-advisories/all.xml",               type:"rss" },
  { id:"thn",        name:"THN",     label:"The Hacker News",      color:"#ff9922", url:"https://feeds.feedburner.com/TheHackersNews",                          type:"rss" },
  { id:"bleeping",   name:"BC",      label:"BleepingComputer",     color:"#33ddff", url:"https://www.bleepingcomputer.com/feed/",                               type:"rss" },
  { id:"sans",       name:"SANS",    label:"SANS ISC",             color:"#22ee88", url:"https://isc.sans.edu/rssfeed_full.xml",                                type:"rss" },
  { id:"otx",        name:"OTX",     label:"AlienVault OTX",       color:"#cc77ff", url:"https://otx.alienvault.com/api/v1/pulses/subscribed?limit=10",         type:"otx" },
  { id:"urlhaus",    name:"URLhaus", label:"Abuse.ch URLhaus",     color:"#ff4477", url:"https://urlhaus-api.abuse.ch/v1/urls/recent/limit/10/",                type:"urlhaus" },
  { id:"threatfox",  name:"TFox",    label:"Abuse.ch ThreatFox",   color:"#ff8844", url:"https://threatfox.abuse.ch/export/json/recent/",                       type:"threatfox" },
  { id:"openphish",  name:"OPhish",  label:"OpenPhish",            color:"#ffdd33", url:"https://openphish.com/feed.txt",                                       type:"openphish" },
  { id:"spamhaus",   name:"Spam",    label:"Spamhaus",             color:"#44ee99", url:"https://www.spamhaus.org/news/article/rss",                            type:"rss" },
  { id:"greynoise",  name:"GNoise",  label:"GreyNoise",            color:"#44bbff", url:"https://feeds.feedburner.com/GreyNoiseBlog",                           type:"rss" },
  { id:"darkreading",name:"DR",      label:"Dark Reading",         color:"#ff6688", url:"https://www.darkreading.com/rss.xml",                                  type:"rss" },
  { id:"googlesec",  name:"GSEC",    label:"Google Security",      color:"#4db8ff", url:"https://security.googleblog.com/feeds/posts/default",                  type:"atom" },
  { id:"talos",      name:"Talos",   label:"Talos Intelligence",   color:"#ff7744", url:"https://blog.talosintelligence.com/feeds/posts/default",               type:"atom" },
  { id:"rosti",      name:"Rosti",   label:"Rosti Threat Intel",   color:"#bb88ff", url:"https://roesti.bin.re/api/v2/reports/?ordering=-created_at&limit=8",   type:"rosti" },
  { id:"unit42",     name:"Unit42",  label:"Palo Alto Unit 42",     color:"#ff6633", url:"https://unit42.paloaltonetworks.com/feed/",                               type:"rss" },
  { id:"st",         name:"ST",      label:"Straits Times Cyber",   color:"#e8003d", url:"https://www.straitstimes.com/tags/cybersecurity/rss.xml",                 type:"rss" },
];

const SEV_KEYWORDS = {
  CRITICAL:["critical","zero-day","0-day","ransomware","rce","remote code execution","emergency","actively exploited"],
  HIGH:    ["high","vulnerability","exploit","breach","malware","backdoor","cve","patch","injection"],
  MEDIUM:  ["medium","advisory","warning","suspicious","phishing","threat","attack"],
  LOW:     ["low","update","informational","notice","awareness"],
};

let allItems=[], selected={}, activeFilter="ALL", activeKeyword="";

function getSeverity(t,d){
  const s=(t+" "+d).toLowerCase();
  for(const [l,kws] of Object.entries(SEV_KEYWORDS)) if(kws.some(k=>s.includes(k))) return l;
  return "INFO";
}
function formatDate(s){
  if(!s) return "";
  try{ return new Date(s).toLocaleDateString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }catch{return "";}
}
function parseRSS(xml){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  return Array.from(doc.querySelectorAll("item")).slice(0,8).map(i=>({
    title:i.querySelector("title")?.textContent?.trim()||"No title",
    link: i.querySelector("link")?.textContent?.trim()||"#",
    desc: (i.querySelector("description")?.textContent||"").replace(/<[^>]*>/g,"").trim().slice(0,200),
    date: i.querySelector("pubDate")?.textContent?.trim()||"",
  }));
}
function setPillStatus(id,state,count,color){
  const pill=document.querySelector(`[data-pill="${id}"]`); if(!pill) return;
  const dot=pill.querySelector(".pill-dot"), cnt=pill.querySelector(".pill-count");
  dot.style.background=state==="loading"?"#ffcc00":(state==="ok"?color:"#4a7a9a");
  dot.style.boxShadow =state==="loading"?"0 0 8px #ffcc00":(state==="ok"?`0 0 8px ${color}`:"none");
  if(cnt) cnt.textContent=count;
}
function makeItem(src,title,desc,link,date){
  return { title,desc,link,date, id:btoa(encodeURIComponent(link)).slice(0,12),
    source:src.id, sourceLabel:src.label, sourceColor:src.color, severity:getSeverity(title,desc) };
}

async function fetchFeed(source){
  setPillStatus(source.id,"loading",0,source.color);
  try{
    let items=[];
    const proxy="https://api.allorigins.win/get?url="+encodeURIComponent(source.url);
    if(source.type==="rss"){
      const j=await(await fetch(proxy)).json();
      items=parseRSS(j.contents).map(i=>makeItem(source,i.title,i.desc,i.link,i.date));
    } else if(source.type==="otx"){
      const j=await(await fetch(proxy)).json();
      const d=JSON.parse(j.contents);
      items=(d.results||[]).slice(0,8).map(p=>makeItem(source,p.name,p.description||p.tags?.join(", ")||"",`https://otx.alienvault.com/pulse/${p.id}`,p.created));
    } else if(source.type==="urlhaus"){
      const j=await(await fetch(proxy)).json();
      const d=JSON.parse(j.contents);
      items=(d.urls||[]).slice(0,8).map(u=>makeItem(source,
        `Malware URL [${u.url_status?.toUpperCase()||"ACTIVE"}] — ${u.threat||"unknown"}`,
        `Host: ${u.host||"?"} | Tags: ${(u.tags||[]).join(", ")||"none"}`,u.url,u.date_added));
    } else if(source.type==="threatfox"){
      const j=await(await fetch(proxy)).json();
      const tf=JSON.parse(j.contents);
      const entries=Object.values(tf).flat().slice(0,8);
      items=entries.map(e=>makeItem(source,
        `IOC [${e.ioc_type||"?"}]: ${e.ioc||"unknown"} — ${e.malware_printable||e.malware||"unknown malware"}`,
        `Confidence: ${e.confidence_level||"?"}% | Tags: ${(e.tags||[]).join(", ")||"none"}`,
        `https://threatfox.abuse.ch/ioc/${e.id}/`,e.first_seen));
    } else if(source.type==="openphish"){
      const j=await(await fetch(proxy)).json();
      const lines=(j.contents||"").split("\n").filter(l=>l.trim().startsWith("http")).slice(0,8);
      items=lines.map(url=>{
        let host=""; try{host=new URL(url.trim()).hostname;}catch{}
        return makeItem(source,`Active Phishing URL — ${host}`,`Live phishing page: ${url.trim()}`,url.trim(),"");
      });
    } else if(source.type==="atom"){
      const j=await(await fetch(proxy)).json();
      const doc=new DOMParser().parseFromString(j.contents,"text/xml");
      const entries=Array.from(doc.querySelectorAll("entry")).slice(0,8);
      items=entries.map(e=>{
        const title=e.querySelector("title")?.textContent?.trim()||"No title";
        const link=e.querySelector("link")?.getAttribute("href")||e.querySelector("link")?.textContent?.trim()||"#";
        const desc=(e.querySelector("summary")?.textContent||e.querySelector("content")?.textContent||"").replace(/<[^>]*>/g,"").trim().slice(0,200);
        const date=e.querySelector("published")?.textContent||e.querySelector("updated")?.textContent||"";
        return makeItem(source,title,desc,link,date);
      });
    } else if(source.type==="rosti"){
      const j=await(await fetch(proxy)).json();
      const d=JSON.parse(j.contents);
      items=(d.results||[]).slice(0,8).map(r=>makeItem(source,
        r.title||r.name||"Threat Report",
        (r.summary||r.description||r.tags?.join(", ")||"").slice(0,200),
        r.url||`https://roesti.bin.re/reports/${r.id}/`,
        r.created_at||r.created||""
      ));
    }
    setPillStatus(source.id,"ok",items.length,source.color);
    return items;
  }catch(e){
    setPillStatus(source.id,"error",0,source.color);
    return [];
  }
}

function renderPills(){
  document.getElementById("source-pills").innerHTML=SOURCES.map(s=>`
    <div class="source-pill" data-pill="${s.id}" style="border-color:${s.color}55">
      <span class="pill-dot"></span>
      <span class="pill-name" style="color:${s.color}">${s.name}</span>
      <span class="pill-count">0</span>
    </div>`).join("");
}

function wildcardToRegex(pattern) {
  // Escape all special regex chars except *, then convert * to .*
  const escaped = pattern.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
  return new RegExp(escaped, 'gi');
}

function wildcardMatch(text, pattern) {
  if (!pattern) return true;
  if (pattern === '*') return true;
  try { return wildcardToRegex(pattern).test(text); }
  catch(e) { return text.toLowerCase().includes(pattern.toLowerCase()); }
}

function highlight(text, kw) {
  if (!kw || kw === '*') return text;
  try {
    // For highlight, replace * with a broad match to show what matched
    const escaped = kw.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '[^\\s]*');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="keyword-highlight">$1</span>');
  } catch(e) { return text; }
}

function renderFeed(){
  let filtered = activeFilter==="ALL" ? allItems : allItems.filter(i=>i.severity===activeFilter);
  if (activeKeyword) {
    const kw = activeKeyword;
    filtered = filtered.filter(i =>
      wildcardMatch(i.title, kw) ||
      wildcardMatch(i.desc, kw) ||
      wildcardMatch(i.sourceLabel, kw)
    );
  }
  const matchCount = document.getElementById("search-match-count");
  if (activeKeyword) {
    matchCount.textContent = filtered.length + " MATCH" + (filtered.length !== 1 ? "ES" : "");
  } else {
    matchCount.textContent = "";
  }
  const counts={CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0,INFO:0};
  allItems.forEach(i=>counts[i.severity]++);
  document.querySelectorAll(".filter-btn").forEach(btn=>{
    const f=btn.dataset.filter;
    btn.className="filter-btn"+(f===activeFilter?` active-${f}`:"");
    const cnt=btn.querySelector(".fc");
    if(cnt) cnt.textContent="("+(f==="ALL"?allItems.length:counts[f])+")";
  });
  const selCount=Object.values(selected).filter(Boolean).length;
  document.getElementById("selected-count").textContent=selCount>0?`${selCount} SELECTED`:"";
  document.getElementById("status-text").textContent=selCount===0
    ?"◇ CLICK ITEMS ABOVE TO SELECT FOR DIGEST"
    :`◈ ${selCount} ITEM${selCount>1?"S":""} QUEUED FOR TRANSMISSION`;
  document.getElementById("clear-btn").style.display=selCount>0?"block":"none";
  const sb=document.getElementById("send-btn");
  sb.className=selCount>0?"active":""; sb.disabled=selCount===0;

  const feed=document.getElementById("feed");
  if(filtered.length===0){
    feed.innerHTML=`<div id="empty-msg">${allItems.length===0?"◌ SCANNING THREAT FEEDS...":"NO THREATS DETECTED"}</div>`;
    return;
  }
  feed.innerHTML=filtered.map((item,idx)=>{
    const isSel=!!selected[item.id];
    return `<div class="feed-item${isSel?` selected-${item.severity}`:""}" onclick="toggleSelect('${item.id}')" style="animation-delay:${idx*0.03}s">
      <div class="item-accent"></div>
      <div class="item-inner">
        <div class="item-checkbox"><div class="check-inner"></div></div>
        <div class="item-body">
          <div class="item-meta">
            <span class="sev-badge sev-${item.severity}">${item.severity}</span>
            <span class="src-badge" style="border:1px solid ${item.sourceColor}66;color:${item.sourceColor}">${item.sourceLabel}</span>
            ${item.date?`<span class="item-date">${formatDate(item.date)}</span>`:""}
          </div>
          <div class="item-title">${item.title}</div>
          ${item.desc?`<div class="item-desc">${item.desc.slice(0,160)}${item.desc.length>160?"...":""}</div>`:""}
        </div>
        <a class="item-link" href="${item.link}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">OPEN ↗</a>
      </div>
    </div>`;
  }).join("");
}

function toggleSelect(id){
  const item=allItems.find(i=>i.id===id); if(!item) return;
  selected[id]=selected[id]?null:item; renderFeed();
}
function clearSelected(){ selected={}; renderFeed(); }
function setFilter(f){ activeFilter=f; renderFeed(); }

async function fetchAll(){
  const btn=document.getElementById("refresh-btn");
  btn.disabled=true; btn.textContent="◌ SCANNING...";
  allItems=[]; renderFeed();
  const results=await Promise.all(SOURCES.map(fetchFeed));
  allItems=results.flat().sort((a,b)=>["CRITICAL","HIGH","MEDIUM","LOW","INFO"].indexOf(a.severity)-["CRITICAL","HIGH","MEDIUM","LOW","INFO"].indexOf(b.severity));
  document.getElementById("sync-info").textContent=`LAST SYNC: ${new Date().toLocaleTimeString()} · FEEDS: ${SOURCES.length} ACTIVE`;
  btn.disabled=false; btn.textContent="⟳ REFRESH";
  renderFeed();
  startAutoRefresh();
}

async function sendToTelegram(){
  const items=Object.values(selected).filter(Boolean); if(!items.length) return;
  const sb=document.getElementById("send-btn");
  sb.textContent="◌ TRANSMITTING..."; sb.disabled=true;

  // Strip special chars that break Telegram - use plain text mode
  function clean(str){ return (str||"").replace(/[_*[\]`]/g," ").trim(); }

  const emojis={CRITICAL:"🔴",HIGH:"🟠",MEDIUM:"🟡",LOW:"🟢",INFO:"🔵"};
  const lines=[];
  lines.push("🔐 THREAT INTEL DIGEST");
  lines.push("📅 "+new Date().toUTCString());
  lines.push("─".repeat(28));
  lines.push("");
  items.forEach((i,idx)=>{
    const emoji=emojis[i.severity]||"⚪";
    lines.push(emoji+" ["+i.severity+"] "+i.sourceLabel);
    lines.push(clean(i.title));
    if(i.desc) lines.push(clean(i.desc).slice(0,150)+"...");
    lines.push("🔗 "+i.link);
    if(idx<items.length-1) lines.push("─".repeat(20));
  });
  lines.push("");
  lines.push("Sent via Threat Intel Dashboard");

  const message=lines.join("\n");

  try{
    const res=await fetch("https://api.telegram.org/bot"+TELEGRAM_TOKEN+"/sendMessage",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID, text:message, disable_web_page_preview:true})
    });
    const d=await res.json();
    if(d.ok){
      showResult("success");
    } else {
      showResult("error: "+d.error_code+" — "+d.description);
    }
  }catch(e){
    showResult("error: "+e.message);
  }
  sb.textContent="✈ SEND TO TELEGRAM"; sb.disabled=false;
}

function showResult(type){
  const el=document.getElementById("send-result");
  if(type==="success"){
    el.className="success";
    el.textContent="✓ DIGEST TRANSMITTED SUCCESSFULLY TO TELEGRAM";
  } else {
    el.className="error";
    el.textContent="✕ FAILED: "+(type.startsWith("error:") ? type.replace("error:","").trim() : "Unknown error");
  }
  setTimeout(()=>{el.className="";el.textContent="";},8000);
}

function onSearch(val) {
  activeKeyword = val.trim();
  document.getElementById("search-clear").style.display = activeKeyword ? "block" : "none";
  renderFeed();
}
function clearSearch() {
  activeKeyword = "";
  const inp = document.getElementById("keyword-input");
  inp.value = "";
  inp.focus();
  document.getElementById("search-clear").style.display = "none";
  document.getElementById("search-match-count").textContent = "";
  renderFeed();
}

// Auto-refresh every 300 minutes
const AUTO_REFRESH_MS = 300 * 60 * 1000;
let autoRefreshTimer = null;
let nextRefreshAt = null;
let countdownTimer = null;

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  if (countdownTimer) clearInterval(countdownTimer);
  nextRefreshAt = Date.now() + AUTO_REFRESH_MS;
  updateCountdown();
  autoRefreshTimer = setInterval(function() {
    fetchAll();
    nextRefreshAt = Date.now() + AUTO_REFRESH_MS;
  }, AUTO_REFRESH_MS);
  countdownTimer = setInterval(updateCountdown, 60000);
}

function updateCountdown() {
  const el = document.getElementById("next-refresh");
  if (!el || !nextRefreshAt) return;
  const msLeft = nextRefreshAt - Date.now();
  if (msLeft <= 0) { el.textContent = "AUTO-REFRESH NOW"; return; }
  const minsLeft = Math.ceil(msLeft / 60000);
  el.textContent = "NEXT AUTO-REFRESH: " + minsLeft + " MIN" + (minsLeft !== 1 ? "S" : "");
}

// Attach input events after DOM ready
window.addEventListener("DOMContentLoaded", function() {
  renderPills();
  fetchAll();
  startAutoRefresh();
  const inp = document.getElementById("keyword-input");
  if (inp) {
    inp.addEventListener("input",  function(){ onSearch(this.value); });
    inp.addEventListener("keyup",  function(){ onSearch(this.value); });
    inp.addEventListener("change", function(){ onSearch(this.value); });
    inp.addEventListener("search", function(){ onSearch(this.value); });
  }
});
</script>
